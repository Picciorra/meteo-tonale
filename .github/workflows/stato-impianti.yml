# Ogni mattina legge lo stato delle piste con API Anything e lo salva in stato.json.
# Gira sui server di GitHub: il tuo PC può restare spento.
# La prima volta impara l'operazione da sola e la salva in api-anything/pontedilegno.json.
name: Stato impianti

on:
  schedule:
    - cron: "30 6 * * *"   # 7:30 ora italiana d'inverno (8:30 d'estate)
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write           # serve per salvare stato.json nel repository

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    env:
      API_ANYTHING_HOME: ${{ github.workspace }}/../api-anything-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa API Anything (versione fissata, per sicurezza)
        run: |
          dir="$(mktemp -d)"
          git clone -q https://github.com/goodnight000/api-anything.git "$dir"
          cd "$dir"
          git checkout -q 7e301989e3095fc38b992bdb8bd9bcee90600a8b
          npm ci --no-audit --no-fund
          npm install -g "$(npm pack --silent)"

      - name: Prepara l'operazione statoPiste (la impara se manca)
        run: |
          mkdir -p "$API_ANYTHING_HOME/sites" api-anything
          if [ -f api-anything/pontedilegno.json ]; then
            cp api-anything/pontedilegno.json "$API_ANYTHING_HOME/sites/"
            echo "Operazione già presente."
          else
            echo "Imparo l'operazione dalla pagina delle piste..."
            api-anything add pontedilegno statoPiste \
              --trigger 'https://www.pontedilegnotonale.com/en/pontedilegno-tonale-skiing/{pagina}/' \
              --example pagina=pontedilegno-tonale-slopes \
              --match 'path=/en/pontedilegno-tonale-skiing/*/' \
              --html '{"items":"table.table tr","fields":{"nome":"th","icona":"img@src"}}' \
              --description "Stato aperta/chiusa delle piste di Pontedilegno-Tonale"
            api-anything export pontedilegno --keep-examples --out api-anything/pontedilegno.json
          fi

      - name: Leggi lo stato delle piste
        run: |
          api-anything call pontedilegno statoPiste pagina=pontedilegno-tonale-slopes > risposta.json || true
          node -e '
            const fs = require("fs");
            let r = {};
            try { r = JSON.parse(fs.readFileSync("risposta.json", "utf8")); } catch {}
            const piste = Array.isArray(r.data) ? r.data.filter(x => x && x.nome && x.icona) : [];
            if (!r.ok || !piste.length) {
              console.log("Lettura non riuscita, tengo lo stato precedente:", JSON.stringify(r).slice(0, 500));
              process.exit(0);
            }
            fs.writeFileSync("stato.json", JSON.stringify({ aggiornato: new Date().toISOString(), piste }, null, 2) + "\n");
            console.log("Piste lette:", piste.length, "| tier", r.tier);
            console.log(piste.map(x => x.nome + " = " + x.icona).join("\n"));
          '

      - name: Salva nel repository
        run: |
          git config user.name "stato-impianti-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in stato.json api-anything/pontedilegno.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && echo "Nessuna novità" && exit 0
          git commit -m "Stato impianti $(date -u +%Y-%m-%d)"
          git push
